<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    

    <div class="container">

<div class="row justify-content-center mt-5">

     <div class="col-md-6 col-lg-5">

    <div class="card shadow">

        <div class="card-body p-4">
<h2 class="text-center mb-3">Login Here</h2>
{%if form.non_field_errors%}
<div class="alert alert-danger text-center py-1" role="alert">
 {% for error in form.non_field_errors %}
                  <p class="mb-0 small">{{ error }}</p>
              {% endfor %}
</div>
{%endif%}
<form method="post">
    {%csrf_token%}

<div class="mb-3 d-flex justify-content-center">
    {{form.username.label_tag}}
    {{form.username}}

</div>
<div class="mb-3 d-flex justify-content-center">
    {{form.password.label_tag}}
    {{form.password}}
</div>
<div class="d-flex justify-content-center"><button type="submit" class="btn btn-primary w-50 mt-2">Login</button></div>
</form>
</div>
    </div>
</body>
</html>
